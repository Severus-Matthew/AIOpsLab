kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Cluster 2 — create with: kind create cluster --name kind2 --config kind/kind-config-mac-c2.yaml
# Context will be: kind-kind2  (set AIOPSLAB_CLUSTER=kind2 when running)
networking:
  apiServerPort: 6444
nodes:
  - role: control-plane
    image: jacksonarthurclark/aiopslab-kind-arm:latest
  - role: worker
    image: jacksonarthurclark/aiopslab-kind-arm:latest
