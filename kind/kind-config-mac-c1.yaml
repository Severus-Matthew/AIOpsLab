kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Cluster 1 — create with: kind create cluster --name kind --config kind/kind-config-mac-c1.yaml
# Context will be: kind-kind  (AIOPSLAB default, no env var needed)
networking:
  apiServerPort: 6443
nodes:
  - role: control-plane
    image: jacksonarthurclark/aiopslab-kind-arm:latest
  - role: worker
    image: jacksonarthurclark/aiopslab-kind-arm:latest
