kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "172.28.80.9"
  apiServerPort: 16443
nodes:
  - role: control-plane
    image: jacksonarthurclark/aiopslab-kind-arm:latest
    extraMounts:
      - hostPath: /run/udev
        containerPath: /run/udev
  - role: worker
    image: jacksonarthurclark/aiopslab-kind-arm:latest
    extraMounts:
      - hostPath: /run/udev
        containerPath: /run/udev
